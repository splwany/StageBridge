name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate scripts and property lists
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          plutil -lint Resources/Info.plist StageBridge.xcodeproj/project.pbxproj
      - name: Run isolated checks
        run: ./scripts/test.sh
      - name: Build universal app
        run: ./scripts/build.sh
      - name: Verify architectures
        run: lipo .build/StageBridge.app/Contents/MacOS/StageBridge -verify_arch arm64 x86_64
